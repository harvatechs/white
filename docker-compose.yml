version: "3.8"

services:
  white-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: white-search
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - DEFAULT_SEARCH_PROVIDER=ddg
      - SEARXNG_INSTANCE=https://searx.be
      # Optional: uncomment to enable AI summaries
      # - OPENAI_API_KEY=your-api-key
      # - OPENAI_BASE_URL=https://api.openai.com/v1
      # - OPENAI_MODEL=gpt-4o-mini
    volumes:
      - white-db:/app/db
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/preferences"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  white-db:
    name: white_search_data
